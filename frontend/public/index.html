<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    
    <!--
      Page-specific tags (title, description, canonical, og:*, twitter:*) are
      intentionally NOT hardcoded here. Every route renders <Seo> (see
      src/components/common/Seo.js), which is the single source for those
      tags via react-helmet-async. Duplicating them here would leave two
      <title>/<link rel="canonical"> elements in the DOM — Helmet only
      manages tags it rendered itself, so a hardcoded tag here is never
      replaced, only added alongside. The build's prerender step
      (scripts/prerender.js) bakes each route's Seo output into its own
      static HTML file, so this template's absence of these tags does not
      affect what crawlers see.
    -->
    <meta name="keywords" content="home repair guide, DIY home repair, AI home maintenance, fix leaky faucet, electrical outlet repair, HVAC troubleshooting, drywall repair, plumbing repair, home improvement AI, step-by-step repair instructions" />
    <meta name="author" content="QuickFix AI" />
    <meta name="robots" content="index, follow" />

    <!-- Additional SEO Meta Tags -->
    <meta name="application-name" content="QuickFix AI" />
    <meta name="apple-mobile-web-app-title" content="QuickFix AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#3b82f6" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Favicon and App Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "QuickFix AI",
      "url": "https://quickfixai.net",
      "logo": "https://quickfixai.net/logo512.png",
      "sameAs": [
        "https://apps.apple.com/us/app/quickfixai-home-repair-guide/id6759504103"
      ]
    }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "QuickFix AI",
      "description": "AI-powered home repair guidance providing instant step-by-step instructions for plumbing, electrical, HVAC, drywall, and more household repairs.",
      "url": "https://quickfixai.net",
      "applicationCategory": "HomeApplication",
      "operatingSystem": "Web Browser, iOS",
      "sameAs": [
        "https://apps.apple.com/us/app/quickfixai-home-repair-guide/id6759504103"
      ],
      "offers": [
        {
          "@type": "Offer",
          "name": "Pro Monthly",
          "price": "4.99",
          "priceCurrency": "USD",
          "description": "10 AI repair guides per month, unlimited repair history"
        },
        {
          "@type": "Offer",
          "name": "Pro Lifetime",
          "price": "49.99",
          "priceCurrency": "USD",
          "description": "Unlimited AI repair guides and history, one-time payment"
        }
      ],
      "featureList": [
        "AI-powered repair diagnosis from text, voice, or photo",
        "Step-by-step repair guides with safety warnings",
        "Tool recommendations and time estimates",
        "Plumbing, electrical, HVAC, and drywall coverage",
        "Repair history storage",
        "iOS app available"
      ]
    }
    </script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
